services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: physics
      POSTGRES_PASSWORD: physics
      POSTGRES_DB: physics
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+asyncpg://physics:physics@db:5432/physics
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
