services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: physics
      POSTGRES_PASSWORD: physics
      POSTGRES_DB: physics
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physics -d physics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://physics:physics@db:5432/physics
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  pgdata:
